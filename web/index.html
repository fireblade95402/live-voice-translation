<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live Voice Translation</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🎙️</text></svg>" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand">
          <span class="logo" aria-hidden="true">🎙️</span>
          <div>
            <h1>Live Voice Translation</h1>
            <p class="subtitle">Start a new conversation and speak naturally.</p>
          </div>
        </div>
      </header>

      <section class="controls">
        <div class="control-row">
          <button id="newConversation" class="primary">Start new conversation</button>
          <button id="pauseConversation" class="secondary" disabled>Pause</button>
        </div>
        <div id="languageDisplay" class="language-display" style="display: none;">
          <span class="language-label">Translating between:</span>
          <div class="language-pair">
            <span id="language1" class="language-badge"></span>
            <span class="language-arrow">↔</span>
            <span id="language2" class="language-badge"></span>
          </div>
        </div>
        <p id="status" class="status">Idle</p>
      </section>

      <section class="chat-container">
        <div id="chat" class="chat-messages" aria-live="polite" aria-label="Conversation"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
