<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live Voice Translation</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🎙️</text></svg>" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand">
          <span class="logo" aria-hidden="true">🎙️</span>
          <div>
            <h1>Live Voice Translation</h1>
            <p class="subtitle">Start a new conversation and speak naturally.</p>
          </div>
        </div>
      </header>

      <section class="controls">
        <div class="control-row">
          <label class="lang-picker">
            <span>Language A</span>
            <select id="langA">
              <option value="en-US">English (US)</option>
              <option value="es-ES">Spanish</option>
              <option value="fr-FR">French</option>
              <option value="de-DE">German</option>
              <option value="it-IT">Italian</option>
              <option value="pt-BR">Portuguese (BR)</option>
              <option value="ja-JP">Japanese</option>
              <option value="ko-KR">Korean</option>
              <option value="zh-CN">Chinese (Mandarin)</option>
              <option value="ar-SA">Arabic</option>
              <option value="ru-RU">Russian</option>
              <option value="hi-IN">Hindi</option>
              <option value="nl-NL">Dutch</option>
              <option value="pl-PL">Polish</option>
              <option value="tr-TR">Turkish</option>
            </select>
          </label>
          <label class="lang-picker">
            <span>Language B</span>
            <select id="langB">
              <option value="en-US">English (US)</option>
              <option value="es-ES" selected>Spanish</option>
              <option value="fr-FR">French</option>
              <option value="de-DE">German</option>
              <option value="it-IT">Italian</option>
              <option value="pt-BR">Portuguese (BR)</option>
              <option value="ja-JP">Japanese</option>
              <option value="ko-KR">Korean</option>
              <option value="zh-CN">Chinese (Mandarin)</option>
              <option value="ar-SA">Arabic</option>
              <option value="ru-RU">Russian</option>
              <option value="hi-IN">Hindi</option>
              <option value="nl-NL">Dutch</option>
              <option value="pl-PL">Polish</option>
              <option value="tr-TR">Turkish</option>
            </select>
          </label>
        </div>
        <div class="control-row">
          <button id="newConversation" class="primary">Start</button>
          <button id="pauseConversation" class="secondary" disabled>Pause</button>
          <button id="muteMic" class="secondary" disabled aria-pressed="false">Mute Mic</button>
        </div>
        <div id="languageDisplay" class="language-display">
          <span class="language-label">Translating between:</span>
          <div class="language-pair">
            <span id="language1" class="language-badge"></span>
            <span class="language-arrow">↔</span>
            <span id="language2" class="language-badge"></span>
          </div>
        </div>
        <p id="status" class="status">Idle</p>
      </section>

      <section class="chat-container">
        <div id="chat" class="chat-messages" aria-live="polite" aria-label="Conversation"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
